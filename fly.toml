# Radio Night on Fly.io (ADR 0013)
#
# Exactly one machine, always on. The rate limits, the voice cache and the
# "one synthesis per line" sharing live in the server's memory, so a second
# machine would double every limit and split the cache. Do not scale out
# until those move to shared storage.
#
# Secrets (API keys, DATABASE_URL, GUEST_TOKEN_SECRET) are set with
# `fly secrets`, never here.

app = "radio-night"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  USE_REAL_PROVIDERS = "true"
  LLM_PROVIDER = "anthropic"
  NEXT_PUBLIC_APP_URL = "https://radionight.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 80

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
